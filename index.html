<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f4f0e8"><title>Blend In — Party Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f0e8;--ink:#171916;--muted:#77796f;--line:#d9d4c9;--acid:#dcff55;--coral:#f27860;--card:#fffdf8;--green:#2e5d48;--shadow:0 18px 60px #28261512}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.grain{position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E")}.shell{max-width:1100px;margin:auto;padding:27px 30px 60px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:19px}.brand{display:flex;align-items:center;gap:11px;font:700 18px 'Space Grotesk';letter-spacing:-.7px}.brand-mark{width:30px;height:30px;background:var(--acid);border:1.5px solid var(--ink);border-radius:9px;display:grid;place-items:center;transform:rotate(-5deg);font-size:17px}.topnote{font:11px 'DM Mono';letter-spacing:1px;text-transform:uppercase;color:var(--muted)}main{max-width:760px;margin:64px auto 0}.eyebrow{font:11px 'DM Mono';letter-spacing:1.5px;text-transform:uppercase;color:var(--green);display:flex;gap:9px;align-items:center}.eyebrow:before{content:'';height:1px;width:21px;background:currentColor}.hero{font:700 clamp(45px,9vw,82px)/.96 'Space Grotesk';letter-spacing:-5px;margin:18px 0 22px;max-width:730px}.hero em{font-style:normal;color:var(--green)}.intro{font-size:16px;line-height:1.6;color:#57594f;max-width:500px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:28px;box-shadow:var(--shadow)}.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:36px}.field-label{font:10px 'DM Mono';text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);display:block;margin-bottom:9px}.input{width:100%;height:51px;border:1px solid var(--line);border-radius:9px;background:#fffefb;padding:0 14px;color:var(--ink);outline:none}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px #2e5d481a}.actions{display:flex;gap:11px;margin-top:14px}.btn{height:50px;padding:0 22px;border-radius:9px;border:1.5px solid var(--ink);font-weight:700;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--ink)}.btn.primary{background:var(--acid);flex:1}.btn.secondary{background:transparent}.btn.dark{background:var(--ink);color:#fff}.footnote{font-size:12px;color:var(--muted);margin:13px 1px 0;line-height:1.5}.error{color:#b23927;background:#fff0ed;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:13px}.room-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:25px}.room-code{font:600 25px 'DM Mono';letter-spacing:5px;background:var(--acid);padding:10px 13px;border:1px solid var(--ink);border-radius:8px;display:inline-block;margin-top:8px}.share{color:var(--muted);font-size:13px;margin-top:9px}.h-title{font:700 clamp(36px,7vw,55px)/1 'Space Grotesk';letter-spacing:-2.6px;margin:8px 0 10px}.sub{color:var(--muted);font-size:14px;line-height:1.5}.section{font:10px 'DM Mono';letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;margin:24px 0 10px}.players{display:grid;grid-template-columns:1fr 1fr;gap:9px}.player{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;min-height:53px}.player-left{display:flex;align-items:center;gap:10px}.avatar{width:28px;height:28px;border-radius:9px;background:#e7e5da;display:grid;place-items:center;font-weight:700;font-size:12px}.player.me .avatar{background:var(--acid)}.player-name{font-size:14px;font-weight:600}.you{font:9px 'DM Mono';color:var(--muted);letter-spacing:.4px;margin-left:5px}.score{font:12px 'DM Mono';color:var(--green)}.status-chip{font:9px 'DM Mono';text-transform:uppercase;letter-spacing:.4px;padding:5px 7px;background:#eeece4;border-radius:99px;color:var(--muted)}.section-row{display:flex;align-items:center;justify-content:space-between}.progress{font:11px 'DM Mono';color:var(--muted)}.clue-card{background:#edeee4;border-radius:13px;padding:20px;margin:20px 0}.secret{font:700 31px 'Space Grotesk';letter-spacing:-1px;margin:5px 0 1px}.secret.imposter{color:var(--coral)}.tag{display:inline-flex;background:white;border:1px solid var(--line);border-radius:99px;padding:6px 9px;font:10px 'DM Mono';color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.hint{font-size:13px;line-height:1.5;color:#64665d;margin:11px 0 0}.clue-input{margin-top:15px}.vote-item{width:100%;text-align:left;border:1px solid var(--line);background:#fffefb;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin:8px 0}.vote-item:hover{border-color:var(--green);background:#f7f8f0}.clue-quote{font-size:13px;color:var(--muted);font-weight:400}.waitbox{background:#f0eee7;border-radius:11px;padding:16px;color:#65675e;font-size:14px;line-height:1.5;margin-top:17px}.voteclue{display:flex;align-items:center;gap:10px}.voteclue .avatar{flex:0 0 auto}.voteclue-text{font-size:13px;color:#42443d}.reveal{background:var(--ink);border-radius:14px;padding:24px;color:#f8f5eb;margin:18px 0}.reveal .section{color:#c1c5b7;margin:0 0 13px}.reveal-word{font:700 30px 'Space Grotesk';letter-spacing:-1px;margin:3px 0}.winnerline{font-size:14px;color:#ced0c4;line-height:1.5}.imposter-name{color:var(--acid)}.guessrow{display:flex;gap:9px;margin-top:14px}.guessrow .input{flex:1}.score-list{display:grid;gap:8px}.scoreline{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border:1px solid var(--line);border-radius:10px}.scoreline:first-child{background:#f2f6df}.score-num{font:600 13px 'DM Mono'}.callout{display:flex;align-items:center;gap:9px;color:var(--green);font-size:13px;font-weight:600;margin:13px 0}.spinner{width:13px;height:13px;border:2px solid #c9c6b9;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:var(--ink);color:white;padding:11px 16px;border-radius:9px;font-size:13px;z-index:3}.toast.show{opacity:1;transform:translate(-50%,0)}.round-pill{padding:7px 10px;border:1px solid var(--line);border-radius:99px;font:10px 'DM Mono';color:var(--muted)}@media(max-width:650px){.shell{padding:17px 17px 40px}.topnote{font-size:9px}.hero{letter-spacing:-3px;margin-top:17px}.entry-grid{grid-template-columns:1fr;gap:11px;margin-top:25px}.actions{flex-direction:column}.btn{width:100%}.card{padding:21px}.room-top{flex-direction:column}.players{grid-template-columns:1fr}.guessrow{flex-direction:column}.guessrow .btn{width:100%}main{margin-top:43px}}@media(min-width:651px){main{margin-top:66px}}
</style>
<style>.voice-dock{position:fixed;z-index:5;left:50%;bottom:16px;transform:translateX(-50%);width:min(560px,calc(100vw - 26px));padding:11px 13px;background:#fffdf8;border:1px solid var(--line);border-radius:14px;box-shadow:0 9px 32px #17191622;display:flex;align-items:center;gap:12px}.voice-dock[hidden]{display:none}.voice-toggle{border:1px solid var(--ink);border-radius:9px;background:var(--acid);height:42px;padding:0 15px;font-weight:700;white-space:nowrap}.voice-toggle.off{background:#f0eee7}.voice-meta{min-width:0;flex:1}.voice-title{font-weight:700;font-size:13px}.voice-people{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.voice-dot{display:inline-block;width:8px;height:8px;background:#b1afa5;border-radius:50%;margin-right:5px}.voice-dot.live{background:#4e9a62;box-shadow:0 0 0 3px #4e9a621f}#remoteAudio{display:none}@media(max-width:480px){.voice-dock{bottom:10px}.voice-toggle{padding:0 11px;font-size:12px}.voice-title{font-size:12px}}</style></head>
<body><div class="grain"></div><div class="shell"><header class="top"><div class="brand"><span class="brand-mark">✳</span> BLEND IN</div><div class="topnote">A little bluffing goes a long way</div></header><main id="app"></main></div><div id="voiceDock" class="voice-dock" hidden></div><div id="remoteAudio"></div><div id="toast" class="toast"></div>
<script>
const app=document.querySelector('#app');let saved=JSON.parse(localStorage.getItem('blendIn')||'null'),state=null,eventSource=null,localError='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem('blendIn',JSON.stringify(saved));
function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.error||'Something went wrong');return j}
function connect(){if(!saved)return;eventSource?.close();eventSource=new EventSource(`/events?code=${encodeURIComponent(saved.code)}&playerId=${encodeURIComponent(saved.playerId)}`);eventSource.onmessage=e=>{state=JSON.parse(e.data);render()};eventSource.onerror=async()=>{try{const r=await fetch(`/api/session?code=${encodeURIComponent(saved.code)}&playerId=${encodeURIComponent(saved.playerId)}`);if(r.status===404){eventSource.close();saved=null;state=null;localStorage.removeItem('blendIn');localError='That room has ended. Create or join a room to play again.';renderEntry()}}catch{}}}
async function enter(mode){localError='';const name=document.querySelector('#name').value.trim()||'Player';try{const body={name};let result;if(mode==='create')result=await post('/api/create',body);else{body.code=document.querySelector('#code').value.trim();result=await post('/api/join',body)}saved={code:result.code,playerId:result.playerId};save();state=result.state;connect();render()}catch(e){localError=e.message;renderEntry()}}
async function action(action,data={}){try{await post('/api/action',{...saved,action,...data})}catch(e){toast(e.message)}}
function initials(s){return esc((s||'?').trim().slice(0,1).toUpperCase())}
function header(title,sub){return `<div class="room-top"><div><div class="eyebrow">${esc(title)}</div><h1 class="h-title">${esc(sub)}</h1></div><div><div class="field-label">ROOM CODE</div><div class="room-code">${esc(state.code)}</div><div class="share">Share this code with your crew</div></div></div>`}
function players(list=state.players,opts={}){return `<div class="players">${list.map(p=>`<div class="player ${p.id===saved.playerId?'me':''}"><div class="player-left"><span class="avatar">${initials(p.name)}</span><div><span class="player-name">${esc(p.name)}</span>${p.id===saved.playerId?'<span class="you">YOU</span>':''}${opts.clues&&p.clue?`<div class="clue-quote">“${esc(p.clue)}”</div>`:''}</div></div>${opts.scores?`<span class="score">${p.score} pts</span>`:opts.votes?`<span class="status-chip">${p.voted?'VOTED':'THINKING'}</span>`:''}</div>`).join('')}</div>`}
function renderEntry(){app.innerHTML=`<div class="eyebrow">A social deduction party game</div><h1 class="hero">You know the word.<br><em>They don’t.</em></h1><p class="intro">Everyone gets a word, but one player gets a different one. Trade clues, read the room, and figure out whose word does not match.</p><div class="card"><div class="entry-grid"><label><span class="field-label">YOUR NAME</span><input class="input" id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="nickname"></label><label><span class="field-label">ROOM CODE</span><input class="input" id="code" maxlength="6" placeholder="Only if joining" style="text-transform:uppercase;letter-spacing:2px" autocomplete="off"></label></div><div class="actions"><button class="btn primary" id="create">Create a room ↗</button><button class="btn secondary" id="join">Join with code</button></div>${localError?`<div class="error">${esc(localError)}</div>`:''}<p class="footnote">2–8 players · Each on their own device · Best played together in person</p></div>`;document.querySelector('#create').onclick=()=>enter('create');document.querySelector('#join').onclick=()=>enter('join')}
function render(){if(!state){renderEntry();return}const me=state.me,host=state.hostId===saved.playerId;
if(state.phase==='lobby'){app.innerHTML=`${header('Room lobby','Waiting on the crew')}<p class="sub">Send your friends the room code above. You can start when everyone’s in.</p><div class="section-row"><div class="section">Players</div><div class="progress">${state.players.length} / 8</div></div>${players()}<div class="actions" style="margin-top:20px">${host?`<button class="btn primary" id="start" ${state.players.length<2?'disabled':''}>Start the game ↗</button>`:`<button class="btn primary" disabled>Waiting for host to start…</button>`}<button class="btn secondary" id="leave">Leave room</button></div><p class="footnote">5 rounds. Most players share a word; one gets a different word. In a two-player game, the different-word player guesses the other word.</p>`;document.querySelector('#start')?.addEventListener('click',()=>action('start'));document.querySelector('#leave').onclick=()=>{eventSource?.close();saved=null;state=null;localStorage.removeItem('blendIn');renderEntry()};return}
const phaseNames={clue:'The clue round',vote:'Who’s bluffing?',reveal:'The reveal',score:'Round results'};
if(state.phase==='clue'){const submitted=!!me.clue;app.innerHTML=`${header(phaseNames.clue,`Round ${state.round}`)}<div class="section-row"><div class="section">Your secret</div><div class="round-pill">${state.round} OF ${state.rounds}</div></div><div class="clue-card"><span class="tag">YOUR WORD</span><div class="secret">${esc(me.word)}</div><div class="hint">${me.role==='imposter'?'Your word is different. Blend in and listen for the word everyone else seems to have.':'Most players have your word. Give a short clue that fits, without saying the word outright.'}</div></div><div class="section-row"><div class="section">Drop one clue</div><div class="progress">${state.players.filter(p=>p.clue).length} / ${state.players.length} in</div></div>${submitted?`<div class="waitbox"><div class="callout"><span class="spinner"></span> Clue sent</div>Your clue is locked in. Waiting for everyone else…</div>`:`<form id="clueForm"><input class="input clue-input" id="clue" maxlength="80" placeholder="One or two words is best" autocomplete="off" required><div class="actions"><button class="btn primary">Send my clue ↗</button></div></form>`}<div class="section">Crew status</div>${players(state.players,{votes:true})}`;document.querySelector('#clueForm')?.addEventListener('submit',e=>{e.preventDefault();action('clue',{clue:document.querySelector('#clue').value})});return}
if(state.phase==='duel'){app.innerHTML=`${header('Two-player duel',`Round ${state.round}`)}<p class="sub">Both clues are in. The player with the different word tries to guess the word the other player received.</p><div class="section">The clues</div><div class="players">${state.players.map(p=>`<div class="player ${p.id===saved.playerId?'me':''}"><div class="voteclue"><span class="avatar">${initials(p.name)}</span><span><span class="player-name">${esc(p.name)}</span><div class="clue-quote">“${esc(p.clue)}”</div></span></div></div>`).join('')}</div>${me.role==='imposter'?`<div class="clue-card" style="margin-top:18px"><span class="tag">Your word: ${esc(me.word)}</span><div class="hint">What’s the secret word?</div><form class="guessrow" id="duelForm"><input class="input" id="duelGuess" placeholder="Make your guess" autocomplete="off" required><button class="btn primary">Lock in ↗</button></form></div>`:`<div class="waitbox"><div class="callout"><span class="spinner"></span> Waiting for the imposter to guess…</div>Your secret stays hidden until the reveal.</div>`}`;document.querySelector('#duelForm')?.addEventListener('submit',e=>{e.preventDefault();action('duelGuess',{guess:document.querySelector('#duelGuess').value})});return}
if(state.phase==='vote'){app.innerHTML=`${header(phaseNames.vote,`Round ${state.round}`)}<p class="sub">Compare clues and decide who didn’t know the secret. Your own clue is visible too.</p><div class="section">Everyone’s clues</div><div class="players">${state.players.map(p=>`<div class="player ${p.id===saved.playerId?'me':''}"><div class="voteclue"><span class="avatar">${initials(p.name)}</span><span><span class="player-name">${esc(p.name)}</span>${p.id===saved.playerId?'<span class="you">YOU</span>':''}<div class="clue-quote">“${esc(p.clue)}”</div></span></div></div>`).join('')}</div>${me.hasVoted?`<div class="waitbox"><div class="callout"><span class="spinner"></span> Vote locked in</div>Waiting for everyone to vote…</div>`:`<div class="section">Who’s the imposter?</div>${state.players.filter(p=>p.id!==saved.playerId).map(p=>`<button class="vote-item" data-id="${p.id}"><span class="player-left"><span class="avatar">${initials(p.name)}</span><span class="player-name">${esc(p.name)}</span></span><span>Vote ↗</span></button>`).join('')}`}<div class="section-row" style="margin-top:17px"><div class="section">Votes in</div><div class="progress">${state.players.filter(p=>p.voted).length} / ${state.players.length}</div></div>`;document.querySelectorAll('.vote-item').forEach(b=>b.onclick=()=>action('vote',{targetId:b.dataset.id}));return}
if(state.phase==='reveal'){const imp=state.players.find(p=>p.id===state.imposterId);app.innerHTML=`${header(phaseNames.reveal,`Round ${state.round}`)}<div class="reveal"><div class="section">${state.winner==='group'?'✳ GROUP WINS':'✳ IMPOSTER WINS'}</div><h2 class="reveal-word">${esc(state.message)}</h2><p class="winnerline">${state.duel?'Two-player duel complete. ':''}The imposter was <b class="imposter-name">${esc(imp?.name)}</b>. The shared word was <b>${esc(state.word)}</b>. The imposter's different word was <b>${esc(state.imposterWord)}</b>.</p></div><div class="section">The clues</div>${players(state.players,{clues:true})}${!state.duel&&me.id===state.imposterId?`<div class="clue-card" style="margin-top:18px"><span class="tag">One last chance</span><div class="hint">Guess the shared word correctly to steal 2 points.</div><form class="guessrow" id="guessForm"><input class="input" id="guess" placeholder="What was the word?" autocomplete="off" required><button class="btn primary">Guess ↗</button></form></div>`:''}<div class="actions" style="margin-top:18px">${host?`<button class="btn primary" id="next">${state.round===state.rounds?'See final scores':'Next round ↗'}</button>`:`<button class="btn primary" disabled>Waiting for host…</button>`}</div>`;document.querySelector('#guessForm')?.addEventListener('submit',e=>{e.preventDefault();action('guess',{guess:document.querySelector('#guess').value})});document.querySelector('#next')?.addEventListener('click',()=>action('next'));return}
if(state.phase==='score'){const final=state.round>state.rounds,sorted=[...state.players].sort((a,b)=>b.score-a.score);app.innerHTML=`${header(final?'Game complete':'Round complete',final?'That’s a wrap.':'Scoreboard')}<div class="reveal"><div class="section">${esc(state.message)}</div><h2 class="reveal-word">${final?'Final scores':'The shared word was '+esc(state.word)}</h2>${final?`<p class="winnerline">${sorted.length&&sorted[0].score>0?`${esc(sorted[0].name)} takes the win!`:'A beautifully even game.'} ${sorted.length>1&&sorted[0].score===sorted[1].score?'It’s a tie!':''}</p>`:`<p class="winnerline">Round ${state.round} of ${state.rounds} · See how the crew is doing.</p>`}</div><div class="section">${final?'Leaderboard':'Scores'}</div><div class="score-list">${sorted.map((p,i)=>`<div class="scoreline"><div class="player-left"><span class="avatar">${i===0?'✳':initials(p.name)}</span><span class="player-name">${esc(p.name)}${p.id===saved.playerId?' · you':''}</span></div><span class="score-num">${p.score} pts</span></div>`).join('')}</div><div class="actions" style="margin-top:20px">${host&&!final?`<button class="btn primary" id="next">Next round ↗</button>`:''}<button class="btn secondary" id="home">${final?'Back to home':'Leave game'}</button></div>`;document.querySelector('#next')?.addEventListener('click',()=>action('next'));document.querySelector('#home').onclick=()=>{eventSource?.close();saved=null;state=null;localStorage.removeItem('blendIn');renderEntry()};return}}
if(saved)connect();render();
</script><script src="/voice.js"></script></body></html>
